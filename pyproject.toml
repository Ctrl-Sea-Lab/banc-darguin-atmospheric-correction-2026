[project]
name = "ctrl-sea-research-template"
version = "0.1.0"
description = "Reproducible R/Python/Quarto research project environment"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
report = [
  "ipykernel>=6.29,<8",
  "jupyter>=1.1,<2",
  "numpy>=2,<3",
]
dev = [
  "pytest>=8.3,<10",
]

[tool.uv]
package = false
python-downloads = "manual"
default-groups = ["report", "dev"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
